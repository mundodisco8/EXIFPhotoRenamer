# Linter configuration
# Exclude ui from linting as it has autogenerated code
exclude = ["**/ui/**"]

line-length = 120

output-format = "github"

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (correctness)
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern syntax)
    "B",    # flake8-bugbear (likely bugs)
    "C4",   # flake8-comprehensions (comprehension improvements)
    "TID",  # flake8-tidy-imports (import conventions)
    "SIM",  # flake8-simplify (simplifications)
    "PL",   # pylint (best practices)
    "RUF",  # Ruff-specific rules
    "D",    # pydocstyle (docstring conventions)
    "N",    # pep8-naming (naming conventions)
    "S",    # flake8-bandit (security)
]
ignore = [
    "D100", # Ignore missing docstring in public module
    "D104", # Ignore missing docstring in public package
    "D107", # Ignore missing docstring in __init__
    "D400", # Ignore first line must end in '.', hyperpedantic, considering the first line is a docstring
    "D401", # Ignore first line of doscstring should be imperative
    "D413", # Ignore blank line after last section of a docstring, is just wasted space
    "D415", # Same as D400, first line must end in `.`, `?`, `!`
    "PLR0913", # Ignore too many arguments in function
    # Naming
    "N806", # Ignore variables in functions should be snake case
    "N999", # Ignore modules must use snake case
    # Assert
    # https:#stackoverflow.com/questions/68428293/s101-use-of-assert-detected-for-python-tests
    "S101", # Complains about using assert not being safe as it can be disabled, but it's OK for tests
    # Naming rules
    "N802", # Ignore snake_case for methods. Sorry, I like camelCase
    "N803", # Ignore snake_case for arguments. Sorry, I like camelCase
    "N815", # Allow mixedCase in variables with Class Scope
]

[lint.pep8-naming]
extend-ignore-names = ["test_*"]

[lint.isort.sections]
# Creates "sorting sections" for this specific project
# These are the files that contain autogenerated code from Qt Creator
#"autogeneratedQtCreator" = ["ui.mainWindow", "ui.mediaFileViewer"]
"autogeneratedQtCreator" = ["ui.*"]
"PySide" =["PySide6"]

[lint.isort]
# And this sets the order of those specific sections
section-order = [
  "future",
  "standard-library",
  "third-party",
  "PySide",
  "autogeneratedQtCreator",
  "first-party",
  "local-folder",
]